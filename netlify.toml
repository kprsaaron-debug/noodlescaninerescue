[build]
  publish = "public"
  # Save Netlify credits: skip the build when nothing that affects the live
  # site changed (e.g. README, notes, root-level GitHub Pages redirect files).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/ netlify.toml"

# The old site editor has been retired (see archive/README.md): send /admin to the home page.
[[redirects]]
  from = "/admin"
  to = "/"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302

# Friendly short addresses for the newer pages.
[[redirects]]
  from = "/drone-team"
  to = "/drone-team.html"
  status = 200

[[redirects]]
  from = "/pawfit"
  to = "/pawfit.html"
  status = 200

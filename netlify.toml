[build]
  publish = "public"
  command = "npm run build"

# Keep the dashboard out of search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Friendly short addresses for the newer pages.
[[redirects]]
  from = "/drone-team"
  to = "/drone-team.html"
  status = 200

[[redirects]]
  from = "/pawfit"
  to = "/pawfit.html"
  status = 200
